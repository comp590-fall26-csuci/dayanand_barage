name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Change directory
      run: cd Lab4

    - name: Change directory
      run: cd 590MakefileLab
      
    - name: Compile program
      run: make main

    - name: Run executable and test
      run: make test-output

    - name: Clean build artifacts
      run: make clean
