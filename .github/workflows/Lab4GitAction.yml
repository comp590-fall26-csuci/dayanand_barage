name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Compile program
      working-directory: Lab4/590MakefileLab
      run: make

    - name: Run executable and test
      working-directory: Lab4/590MakefileLab
      run: make test-output

    - name: Run executable and test for all the sequences
      working-directory: Lab4/590MakefileLab
      run: make test

    - name: Clean build artifacts
      working-directory: Lab4/590MakefileLab
      run: make clean
